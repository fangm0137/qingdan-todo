<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="轻单：专注当下的个人待办清单。"><title>轻单 · 待办清单</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%232b6b52'/%3E%3Cpath d='m10 20 7 7 14-15' stroke='white' stroke-width='4' fill='none'/%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body><aside><a class="brand" href="./"><span class="logo">✓</span>轻单<span class="brand-en">QINGDAN</span></a><div class="workspace">个人空间</div><nav id="nav" aria-label="任务视图"><button data-view="all" class="active"><span>▦　全部任务</span><b></b></button><button data-view="today"><span>◷　今天</span><b></b></button><button data-view="important"><span>⚑　重要任务</span><b></b></button><button data-view="completed"><span>✓　已完成</span><b></b></button></nav><div class="side-note"><span class="note-icon">✳</span><strong>把注意力留给重要的事。</strong><p>一步一步，让想法成为完成。</p></div><div class="profile"><span class="avatar">我</span><div>我的清单<small>保存在此浏览器</small></div><span class="local-icon" title="本地保存">▣</span></div></aside>
<main><header><span>个人空间 <span class="slash">/</span> <span id="breadcrumb">全部任务</span></span><time id="date"></time></header><section class="content"><div class="heading"><div><p class="eyebrow">MAKE ROOM FOR WHAT MATTERS</p><h1 id="title">全部任务</h1><p class="subtitle" id="subtitle"></p></div><button class="primary" id="new-task">＋ 新建任务</button></div><div class="stats"><div><span>待办任务</span><strong id="pending-count">0</strong><small>件事，等你开启</small></div><div><span>今日到期</span><strong id="today-count">0</strong><small>给今天一个小目标</small></div><div class="progress-stat"><span>完成进度</span><strong id="progress-label">0<em>%</em></strong><div class="progress"><i id="progress-bar"></i></div></div></div>
<form id="quick-form" class="quick"><span>＋</span><input id="quick-title" aria-label="快速添加任务" placeholder="接下来，要完成什么？" maxlength="160" required autocomplete="off"><button type="submit">添加 <span>↵</span></button></form><div class="toolbar"><div class="tabs" aria-label="完成状态"><button data-status="pending" class="selected">待完成</button><button data-status="all">全部</button></div><div class="filters"><input id="search" type="search" placeholder="搜索任务…" aria-label="搜索任务"><select id="sort" aria-label="排序"><option value="created">最新添加</option><option value="priority">优先级</option><option value="due">截止日期</option></select></div></div><div class="list-label"><span>任务清单</span><span id="visible-count"></span></div><div id="task-list"></div><footer>每完成一件小事，都是向前一步。<span>轻单 / KEEP IT SIMPLE</span></footer></section></main>
<dialog id="editor"><form id="edit-form"><div class="dialog-heading"><h2 id="dialog-title">新建任务</h2><button type="button" id="close-dialog" class="icon-button" aria-label="关闭">×</button></div><label>任务名称<input id="edit-title" maxlength="160" required placeholder="写下你想完成的事" autocomplete="off"></label><label>备注<textarea id="edit-notes" rows="3" maxlength="2000" placeholder="补充一些细节（可选）"></textarea></label><div class="form-row"><label>优先级<select id="edit-priority"><option value="normal">普通</option><option value="high">重要</option><option value="low">低优先级</option></select></label><label>截止日期<input type="date" id="edit-due"></label></div><div class="dialog-actions"><button type="button" id="cancel-dialog">取消</button><button type="submit" class="primary">保存任务</button></div></form></dialog><div id="toast" role="status" aria-live="polite" hidden></div></body></html>
